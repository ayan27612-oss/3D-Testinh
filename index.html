<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Physics Playground</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.6;
        user-select: none;
        pointer-events: none;
      }
      #hud b { color: #7ecbff; }
      #score {
        position: fixed;
        top: 12px;
        right: 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        user-select: none;
        pointer-events: none;
        text-align: right;
      }
      #score span { color: #ffd166; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="hud">
      <b>Rolling ball playground</b><br />
      <b>WASD / Arrows</b> — move &nbsp; <b>Space</b> — jump<br />
      <b>Click</b> — throw ball &nbsp; <b>R</b> — reset scene<br />
      <b>1</b> — spawn box &nbsp; <b>2</b> — spawn sphere &nbsp; <b>Drag</b> — orbit camera &nbsp; <b>Scroll</b> — zoom
    </div>
    <div id="score">Objects: <span id="obj-count">0</span><br />Score: <span id="score-count">0</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
